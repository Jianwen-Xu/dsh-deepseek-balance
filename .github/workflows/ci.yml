name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The bundle formats are the contract: a Host ESM module exporting
      # name/inject/apply, and a browser bundle registering itself with
      # window.__ModuleLoader__ under the package name.
      - name: Verify bundle contract
        run: |
          node --input-type=module -e "
          import('./lib/index.js').then((m) => {
            const missing = ['name', 'inject', 'apply'].filter((k) => m[k] === undefined)
            if (missing.length) throw new Error('lib/index.js missing exports: ' + missing.join(', '))
            console.log('host bundle ok:', m.name, JSON.stringify(m.inject))
          }).catch((err) => { console.error(err); process.exit(1) })
          "
          node -e "
          const fs = require('node:fs')
          const src = fs.readFileSync('lib/client.js', 'utf8')
          if (!src.startsWith('window.__ModuleLoader__.load(')) throw new Error('lib/client.js is not a module-loader bundle')
          const registered = new Map()
          global.window = { __ModuleLoader__: { load: (r) => registered.set(r.id, r) } }
          new Function(src)()
          if (!registered.has('dsh-deepseek-balance')) throw new Error('client bundle registered the wrong id: ' + [...registered.keys()].join(','))
          console.log('client bundle ok: dsh-deepseek-balance')
          "
